<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            padding: 12px;
            padding-bottom: 85px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .balance-badge {
            background-color: #18191c;
            border: 1px solid #2a2b30;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        .usdt-icon { color: #26a17b; font-size: 17px; }
        .plus-btn {
            background-color: #0098ea;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .mining-status-card {
            background-color: #141518;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            width: 75%;
            margin: 0 auto 10px auto;
            border: 1px solid #22242a;
        }
        .status-title { font-size: 11px; color: #8a8d9b; letter-spacing: 1px; margin-bottom: 4px; }
        .timer { font-size: 22px; font-weight: bold; color: #29a0f5; }
        .bee-container { text-align: center; margin: 5px 0; }
        .bee-icon { font-size: 70px; }
        .hash-rate-badge {
            background: #141518;
            padding: 4px 16px;
            border-radius: 8px;
            display: inline-block;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #22242a;
            margin-top: 5px;
        }
        .card {
            background-color: #141518;
            border-radius: 14px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #22242a;
        }
        .power-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-buy {
            background-color: #29a0f5;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-start {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        .btn-start:disabled {
            background-color: #34495e;
            color: #7f8c8d;
            box-shadow: none;
            cursor: not-allowed;
        }
        .exchange-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1c1d22;
        }
        .btn-exchange {
            background-color: #29a0f5;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121316;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #1e2026;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c7080;
            font-size: 11px;
            cursor: pointer;
            gap: 2px;
        }
        .nav-item.active { color: #ffffff; }
        .nav-item i { font-size: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-size: 18px; cursor: pointer;" onclick="alert('Honey Cloud Miner v1.0')">☰</div>
        <div class="balance-badge">
            <i class="fa-solid fa-circle-dollar-to-slot usdt-icon"></i>
            <span id="usdt-balance">0.000000</span> <span style="font-size:11px; color:#26a17b;">USDT</span>
        </div>
