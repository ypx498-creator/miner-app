<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 90px;
        }
        /* Top Navigation Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .flag-icon {
            width: 24px;
            height: 18px;
            border-radius: 3px;
        }
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
        }
        .balance-badge {
            background-color: #18191c;
            border: 1px solid #2a2b30;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .usdt-icon {
            color: #26a17b;
            font-size: 18px;
        }
        .plus-btn {
            background-color: #0098ea;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mining Header Display */
        .mining-status-card {
            background-color: #141518;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            width: 60%;
            margin: 0 auto 15px auto;
            border: 1px solid #22242a;
        }
        .status-title {
            font-size: 11px;
            color: #8a8d9b;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .timer {
            font-size: 24px;
            font-weight: 300;
            color: #e2e8f0;
            margin-top: 2px;
        }

        /* GPU Showcase */
        .gpu-container {
            position: relative;
            text-align: center;
            margin: 10px 0 20px 0;
        }
        .gpu-img {
            width: 80%;
            max-width: 280px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
        }
        .arrow-right {
            position: absolute;
            right: 10px;
            top: 45%;
            color: #555866;
            font-size: 20px;
            cursor: pointer;
        }
        .hash-rate-badge {
            background: #141518;
            padding: 6px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-top: -10px;
            border: 1px solid #22242a;
        }
        .hash-rate-badge span {
            color: #8a8d9b;
            font-size: 14px;
            font-weight: normal;
        }

        /* Card Section */
        .card {
            background-color: #141518;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #22242a;
        }
        .power-label {
            color: #8a8d9b;
            font-size: 13px;
        }
        .power-val {
            font-size: 20px;
            font-weight: bold;
            margin: 4px 0 12px 0;
        }
        .btn-buy {
            background-color: #29a0f5;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .sub-text {
            text-align: center;
            font-size: 11px;
            color: #8a8d9b;
            margin-top: 10px;
        }

        /* Exchange Row */
        .exchange-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .btn-exchange {
            background-color: #29a0f5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Task Row */
        .task-card {
            background-color: #141518;
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #22242a;
            margin-bottom: 20px;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .task-icon {
            background-color: #29a0f5;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .task-title {
            font-size: 14px;
            font-weight: bold;
        }
        .task-sub {
            font-size: 11px;
            color: #8a8d9b;
        }
        .task-badge {
            background-color: #1d2b3a;
            color: #29a0f5;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Bottom Tab Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121316;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e2026;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c7080;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active {
            color: #ffffff;
        }
        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="top-bar">
        <div class="top-left">
            <span class="menu-icon"><i class="fa-solid fa-bars"></i></span>
            <div style="font-size: 80px; margin: 15px 0; text-shadow: 0 5px 15px rgba(0,0,0,0.5);">🐝</div>
        </div>
        <div class="balance-badge">
            <i class="fa-solid fa-circle-nodes usdt-icon"></i>
            <span id="usdt-balance">0.001109</span>
        </div>
        <button class="plus-btn" onclick="alert('Bakiye yükleme yakında aktif olacak!')">+</button>
    </div>

    <!-- Mining Timer -->
    <div class="mining-status-card">
        <div class="status-title">MINING STARTED</div>
        <div class="timer" id="timer">10:35:59</div>
    </div>

    <!-- GPU Showcase -->
    <div class="gpu-container">
        <img src="https://i.ibb.co/L8r3q3P/gpu-miner.png" alt="GPU Miner" class="gpu-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2097/2097276.png'">
        <i class="fa-solid fa-chevron-right arrow-right"></i>
        <br>
        <div class="hash-rate-badge"><span id="hash-count">23.51502</span> <span>Hashes</span></div>
    </div>

    <!-- Güç Card -->
    <div class="card">
        <div class="power-label">Güç</div>
        <div class="power-val">2 000 GPU</div>
        <button class="btn-buy" onclick="alert('Mağazaya yönlendiriliyorsunuz...')">Mağazadan güç satın al</button>
        <div class="sub-text">*Parayı çekmek için Karmaları USDT ile takasla</div>
        
        <div class="exchange-row">
            <div>
                <div class="power-label">Kazılan Hashler</div>
                <div style="font-size: 16px; font-weight: bold; margin-top: 2px;" id="mined-hashes">23.51502</div>
            </div>
            <button class="btn-exchange" onclick="exchangeHashes()">Exchange <i class="fa-solid fa-rotate"></i></button>
        </div>
    </div>

    <!-- Task Row -->
    <div class="task-card" onclick="alert('Davet linki kopyalandı!')">
        <div class="task-left">
            <div class="task-icon"><i class="fa-paper-plane" style="color: white;"></i></div>
            <div>
                <div class="task-title">1 Arkadaş Davet Et</div>
                <div class="task-sub">Ödül: 200 GPU</div>
            </div>
        </div>
        <div class="task-badge">0/1</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('Güç')">
            <i class="fa-solid fa-bars-staggered"></i>
            <span>Güç</span>
        </div>
        <div class="nav-item" onclick="switchTab('Kazan')">
            <i class="fa-solid fa-user-group"></i>
            <span>Kazan</span>
        </div>
        <div class="nav-item active" onclick="switchTab('Kazıcı')">
            <i class="fa-solid fa-fan"></i>
            <span>Kazıcı</span>
        </div>
        <div class="nav-item" onclick="switchTab('Çek')">
            <i class="fa-solid fa-wallet"></i>
            <span>Çek</span>
        </div>
        <div class="nav-item" onclick="switchTab('Görevler')">
            <i class="fa-solid fa-list-check"></i>
            <span>Görevler</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Dynamic Mining Simulation
        let hashes = 23.51502;
        setInterval(() => {
            hashes += 0.00012;
            document.getElementById('hash-count').innerText = hashes.toFixed(5);
            document.getElementById('mined-hashes').innerText = hashes.toFixed(5);
        }, 1000);

        function exchangeHashes() {
            if(hashes > 0) {
                alert(hashes.toFixed(5) + " Hash başarıyla USDT bakiyenize dönüştürüldü!");
                hashes = 0;
                document.getElementById('hash-count').innerText = "0.00000";
                document.getElementById('mined-hashes').innerText = "0.00000";
            }
        }

        function switchTab(tabName) {
            console.log(tabName + " tıklandı");
        }
    </script>
</body>
</html>
