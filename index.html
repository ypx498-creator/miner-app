<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #151c2c;
            border-bottom: 1px solid #222d42;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .online-badge {
            font-size: 0.8rem;
            color: #4cd964;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4cd964;
            border-radius: 50%;
            display: inline-block;
        }

        .main-container {
            padding: 20px;
            flex-grow: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .balance-title {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 2rem;
            font-weight: bold;
            color: #f59e0b;
            margin: 5px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Mining Center */
        .miner-box {
            background: #151c2c;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid #222d42;
        }

        .bee-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .timer {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: monospace;
        }

        .btn {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Leaderboard Style */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .rank {
            font-weight: bold;
            font-size: 1.1rem;
            width: 30px;
            color: #f59e0b;
        }

        .user-info {
            flex-grow: 1;
            text-align: left;
        }

        .user-id {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .user-stats {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #151c2c;
            padding: 12px 0;
            border-top: 1px solid #222d42;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: #f59e0b;
        }

        .nav-icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            🐝 Honey Cloud Miner
        </div>
        <div class="online-badge">
            <span class="dot"></span> Onlayn: <span id="online-users-count">1</span>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="main-container">

        <!-- Tab 1: Mining Center -->
        <div id="tab-miner" class="tab-content active">
            <div class="balance-card">
                <div class="balance-title">Mövcud Balans</div>
                <div class="balance-value"><span id="user-balance">0.0000</span> USDT</div>
                <div style="font-size: 0.85rem; color: #94a3b8;">HSH balansı: <span id="user-hashes">0.0000</span></div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">⚡ GPU</div>
                    <div class="stat-val" id="user-gpu">100</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">👑 VIP Status</div>
                    <div class="stat-val" id="user-vip">VIP 0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">⏳ VIP Vaxtı</div>
                    <div class="stat-val" id="user-vip-time">0g</div>
                </div>
            </div>

            <div class="miner-box">
                <div class="bee-icon">🐝</div>
                <div class="timer" id="mining-timer">24:00:00</div>
                <div style="color: #94a3b8; font-size: 0.9rem;" id="mining-status-text">Mayninq gözləyir</div>
                <button class="btn" onclick="toggleMining()" id="mining-btn">MAYNİNQİ BAŞLAT (24 SAAT)</button>
            </div>
        </div>

        <!-- Tab 2: Leaderboard -->
        <div id="tab-leaderboard" class="tab-content">
            <h2 style="margin-bottom: 15px; font-size: 1.3rem;">🏆 Liderlər Lövhəsi</h2>
            <div class="leaderboard-list" id="leaderboard-container">
                <div style="text-align: center; color: #94a3b8;">Yüklənir...</div>
            </div>
        </div>

    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('miner', this)">
            <span class="nav-icon">⛏️</span>
            <span>Mayner</span>
        </div>
        <div class="nav-item" onclick="switchTab('leaderboard', this)">
            <span class="nav-icon">🏆</span>
            <span>Liderlər</span>
        </div>
    </div>

    <script>
        const SUPABASE_FUNCTION_URL = 'https://SƏNİN_SUPABASE_PROJECT_URL.supabase.co/functions/v1/Miner-sync'; // Buraya öz Supabase Function URL-ini yazın
        const tg = window.Telegram.WebApp;
        tg.expand();

        let miningInterval = null;

        // Tab Değiştirme
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');

            if (tabName === 'leaderboard') {
                loadLeaderboard();
            }
        }

        // 1. Status Yükleme ve 10 Saniyelik Otomatik Güncelleme
        async function fetchStatus() {
            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'status',
                        initData: tg.initData
                    })
                });

                const data = await response.json();
                if (data.ok && data.profile) {
                    updateUI(data.profile, data.online_users);
                }
            } catch (err) {
                console.error("Status yeniləmə xətası:", err);
            }
        }

        // Arayüzü Güncelleme
        function updateUI(profile, onlineUsers) {
            document.getElementById('user-balance').innerText = Number(profile.balance || 0).toFixed(4);
            document.getElementById('user-hashes').innerText = Number(profile.hashes || 0).toFixed(4);
            document.getElementById('user-gpu').innerText = profile.gpu_power || 100;
            document.getElementById('user-vip').innerText = 'VIP ' + (profile.vip_tier || 0);
            document.getElementById('online-users-count').innerText = onlineUsers || 1;

            // Mining Durumu ve Timer
            const now = Date.now();
            const miningEnd = Number(profile.mining_end || 0);

            if (miningEnd > now) {
                document.getElementById('mining-status-text').innerText = 'Mayninq aktivdir';
                document.getElementById('mining-btn').innerText = 'MAYNİNQİ DAYANDIR';
                startTimer(miningEnd);
            } else {
                document.getElementById('mining-status-text').innerText = 'Mayninq dayanıb';
                document.getElementById('mining-btn').innerText = 'MAYNİNQİ BAŞLAT (24 SAAT)';
                document.getElementById('mining-timer').innerText = '24:00:00';
                clearInterval(miningInterval);
            }
        }

        // Mining Timer
        function startTimer(endTime) {
            clearInterval(miningInterval);
            miningInterval = setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;

                if (diff <= 0) {
                    clearInterval(miningInterval);
                    fetchStatus();
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('mining-timer').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Mining Toggle
        async function toggleMining() {
            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'toggle',
                        initData: tg.initData
                    })
                });
                const data = await response.json();
                if (data.ok && data.profile) {
                    updateUI(data.profile, data.online_users);
                }
            } catch (err) {
                console.error("Toggle xətası:", err);
            }
        }

        // 2. Liderler Tablosunu Çekme
        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '<div style="text-align: center; color: #94a3b8;">Yüklənir...</div>';

            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'leaderboard' })
                });

                const data = await response.json();
                if (data.ok && data.leaders) {
                    container.innerHTML = '';
                    if (data.leaders.length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: #94a3b8;">Hələ heç kim yokdur.</div>';
                        return;
                    }

                    data.leaders.forEach((user, index) => {
                        const item = document.createElement('div');
                        item.className = 'leader-item';
                        item.innerHTML = `
                            <div class="rank">#${index + 1}</div>
                            <div class="user-info">
                                <div class="user-id">ID: ${user.telegram_id}</div>
                                <div class="user-stats">HSH: ${Number(user.hashes || 0).toFixed(2)} | GPU: ${user.gpu_power || 100}</div>
                            </div>
                            <div style="font-size: 0.85rem; font-weight: bold; color: #f59e0b;">VIP ${user.vip_tier || 0}</div>
                        `;
                        container.appendChild(item);
                    });
                }
            } catch (err) {
                container.innerHTML = '<div style="text-align: center; color: #ef4444;">Yükləmə xətası!</div>';
            }
        }

        // Başlangıçta verileri al
        fetchStatus();

        // Her 10 saniyede bir otomatik verileri (online ve HSH) güncelle
        setInterval(fetchStatus, 10000);

    </script>
</body>
</html>
