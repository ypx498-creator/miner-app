<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Honey Cloud Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1020;--panel:#151d31;--gold:#ffc83d;--text:#f8fafc;--muted:#a8b3c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding-bottom:85px}
.wrap{max-width:560px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:19px}
.panel{background:var(--panel);border:1px solid #2b3853;border-radius:18px;padding:16px;margin:14px 0}
.balance{background:linear-gradient(135deg,#3c2b0e,#1d2638);border:1px solid #695126;border-radius:20px;padding:20px;margin-top:18px}
.amount{font-size:30px;font-weight:bold;margin:10px 0}
.muted{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);padding:12px 8px;border-radius:13px;overflow-wrap:anywhere}
.stat strong{display:block;margin-top:8px;font-size:14px}
.bee{font-size:70px;text-align:center;margin:15px}
.timer{font-size:25px;text-align:center;font-weight:bold}
.status{text-align:center;color:var(--muted);margin:10px}
.progress{height:8px;background:#0b1020;border-radius:10px;overflow:hidden;margin:12px 0}
.bar{height:100%;width:0;background:var(--gold)}
button{cursor:pointer;border:0;border-radius:12px;padding:13px;font-weight:bold;font-size:14px}
button:disabled{opacity:.55}
.btn{width:100%;background:var(--gold);color:#201707}
.secondary{background:#263550;color:white}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #2b3853}
.tab{display:none}
.tab.active{display:block}
.package{background:#1b2740;padding:13px;border-radius:13px;margin:10px 0}
input{width:100%;padding:13px;margin:8px 0;background:#0c1425;color:white;border:1px solid #35435f;border-radius:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1424;border-top:1px solid #2b3853;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px;z-index:5}
.nav button{background:transparent;color:#a8b3c7;font-size:10px;padding:8px 1px}
.nav button span{display:block;font-size:20px;margin-bottom:4px}
.nav button.active{color:var(--gold)}
.notice{font-size:12px;color:#c3cede;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>🐝 Honey Cloud Miner</h1><div class="muted">Bal yığ, gücünü artır</div></div>
  <div>☁️ v1.0</div>
</header>

<div class="balance">
  <div class="muted">MÖVCUD BALANS</div>
  <div class="amount"><span id="usdt">0.0000</span> USDT</div>
  <div class="muted">HSH balansı: <strong id="hashesTop">0.0000</strong></div>
</div>

<div class="stats">
  <div class="stat"><div class="muted">⚡ GPU</div><strong id="gpu">9,100</strong></div>
  <div class="stat"><div class="muted">⛏️ Status</div><strong id="smallStatus">Yoxlanır</strong></div>
  <div class="stat"><div class="muted">👤 Hesab</div><strong id="userId">Qonaq</strong></div>
</div>

<section class="tab active" id="miner">
  <div class="panel">
    <h3>⛏️ Mayninq mərkəzi</h3>
    <div class="bee">🐝</div>
    <div class="timer" id="timer">24:00:00</div>
    <div class="status" id="status">Server yoxlanılır...</div>
