<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 90px;
        }
        /* Üst Menü */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .flag-icon {
            width: 24px;
            height: 18px;
            border-radius: 3px;
        }
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
        }
        .balance-badge {
            background-color: #18191c;
            border: 1px solid #2a2b30;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .usdt-icon {
            color: #26a17b;
            font-size: 18px;
        }
        .plus-btn {
            background-color: #0098ea;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sayaç Kartı */
        .mining-status-card {
            background-color: #141518;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            width: 60%;
            margin: 0 auto 15px auto;
            border: 1px solid #22242a;
        }
        .status-title {
            font-size: 11px;
            color: #8a8d9b;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .timer {
            font-size: 24px;
            font-weight: 300;
            color: #e2e8f0;
            margin-top: 2px;
        }

        /* Arı İkonu Alanı */
        .bee-container {
            text-align: center;
            margin: 10px 0 20px 0;
            position: relative;
        }
        .bee-icon {
            font-size: 90px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px rgba(234, 179, 8, 0.3));
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .hash-rate-badge {
            background: #141518;
            padding: 6px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: 1px solid #22242a;
        }
        .hash-rate-badge span {
            color: #8a8d9b;
            font-size: 14px;
            font-weight: normal;
        }

        /* Güç / Madencilik Kartı */
        .card {
            background-color: #141518;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #22242a;
        }
        .power-label {
            color: #8a8d9b;
            font-size: 13px;
        }
        .power-val {
            font-size: 20px;
            font-weight: bold;
            margin: 4px 0 12px 0;
        }
        .btn-buy {
            background-color: #29a0f5;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .sub-text {
            text-align: center;
            font-size: 11px;
            color: #8a8d9b;
            margin-top: 10px;
        }

        /* Takas Satırı */
        .exchange-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #1c1d22;
        }
        .btn-exchange {
            background-color: #29a0f5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Görev Kartı */
        .task-card {
            background-color: #141518;
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #22242a;
            margin-bottom: 20px;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .task-icon {
            background-color: #29a0f5;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .task-title {
            font-size: 14px;
            font-weight: bold;
        }
        .task-sub {
            font-size: 11px;
            color: #8a8d9b;
        }
        .task-badge {
            background-color: #1d2b3a;
            color: #29a0f5;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Alt Menü Tabları */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121316;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e2026;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c7080;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active {
            color: #ffffff;
        }
        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <div class="top-bar">
