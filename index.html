<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 90px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .balance-badge {
            background-color: #18191c;
            border: 1px solid #2a2b30;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .usdt-icon { color: #26a17b; font-size: 18px; }
        .mining-status-card {
            background-color: #141518;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            width: 70%;
            margin: 0 auto 15px auto;
            border: 1px solid #22242a;
        }
        .status-title { font-size: 11px; color: #8a8d9b; letter-spacing: 1px; }
        .timer { font-size: 22px; font-weight: 300; color: #e2e8f0; margin-top: 2px; }
        .bee-container { text-align: center; margin: 15px 0; }
        .bee-icon { font-size: 80px; }
        .hash-rate-badge {
            background: #141518;
            padding: 6px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #22242a;
        }
        .card {
            background-color: #141518;
            border-radius: 16px;
            padding: 16px;
            margin-top: 15px;
            border: 1px solid #22242a;
        }
        .btn-buy {
            background-color: #29a0f5;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121316;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e2026;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c7080;
            font-size: 11px;
        }
        .nav-item.active { color: #ffffff; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-size: 20px;">☰</div>
        <div class="balance-badge">
            <i class="fa-solid fa-circle-nodes usdt-icon"></i>
            <span>0.001109</span>
        </div>
        <div style="background:#0098ea; padding:4px 10px; border-radius:6px; font-weight:bold;">+</div>
    </div>

    <div class="mining-status-card">
        <div class="status-title">MINING STARTED</div>
        <div class="timer">10:35:59</div>
    </div>

    <div class="bee-container">
        <div class="bee-icon">🐝</div>
        <div class="hash-rate-badge"><span id="hash-count">23.51502</span> <span style="color:#8a8d9b; font-size:14px;">Hashes</span></div>
    </div>

    <div class="card">
        <div style="color:#8a8d9b; font-size:13px;">Güç</div>
        <div style="font-size:20px; font-weight:bold;">2 000 GPU</div>
        <button class="btn-buy" onclick="alert('Mağaza yakında açılacak!')">Mağazadan güç satın al</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item"><span>Güç</span></div>
        <div class="nav-item"><span>Kazan</span></div>
        <div class="nav-item active"><span>Kazıcı</span></div>
        <div class="nav-item"><span>Çek</span></div>
        <div class="nav-item"><span>Görevler</span></div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        let hashes = 23.51502;
        setInterval(() => {
            hashes += 0.00012;
            const el = document.getElementById('hash-count');
            if(el) el.innerText = hashes.toFixed(5);
        }, 1000);
    </script>
</body>
</html>
