<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Honey Cloud Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0d;
            color: #ffffff;
            padding: 12px;
            padding-bottom: 85px;
            overflow-x: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .balance-badge {
            background-color: #18191c;
            border: 1px solid #2a2b30;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        .usdt-icon { color: #26a17b; font-weight: bold; font-size: 16px; }
        .plus-btn {
            background-color: #0098ea;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .mining-status-card {
            background-color: #141518;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            width: 85%;
            margin: 0 auto 10px auto;
            border: 1px solid #22242a;
        }
        .status-title { font-size: 11px; color: #8a8d9b; letter-spacing: 1px; margin-bottom: 4px; }
        .timer { font-size: 22px; font-weight: bold; color: #29a0f5; }
        .bee-container { text-align: center; margin: 10px 0; }
        .bee-icon { font-size: 60px; }
        .hash-rate-badge {
            background: #141518;
            padding: 6px 16px;
            border-radius: 8px;
            display: inline-block;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #22242a;
            margin-top: 5px;
        }
        .card {
            background-color: #141518;
            border-radius: 14px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #22242a;
        }
        .power-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-buy, .btn-share, .btn-start {
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-buy { background-color: #29a0f5; }
        .btn-share { background-color: #27ae60; margin-top: 8px; }
        .btn-start { background-color: #27ae60; font-size: 15px; margin-bottom: 10px; }
        .btn-start:disabled { background-color: #34495e; color: #7f8c8d; cursor: not-allowed; }
        
        .exchange-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1c1d22;
        }
        .btn-exchange {
            background-color: #29a0f5;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin: 10px 0;
            min-height: 40px;
        }
        .ref-input-box {
            background: #0b0b0d;
            border: 1px solid #2a2b30;
            border-radius: 8px;
            padding: 10px;
            color: #29a0f5;
            font-size: 12px;
            word-break: break-all;
            margin: 10px 0;
            text-align: center;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1e2026;
        }
        .task-item:last-child { border-bottom: none; }
        .task-info { display: flex; align-items: center; gap: 10px; }
        .task-icon { font-size: 22px; }
        .task-title { font-size: 13px; font-weight: bold; }
        .task-reward { font-size: 11px; color: #f39c12; font-weight: bold; }
        .btn-task {
            background-color: #29a0f5;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-task:disabled { background-color: #27ae60; cursor: default; }

        .wheel-box { text-align: center; padding: 20px 0; }
        .wheel-disc { font-size: 80px; display: inline-block; transition: transform 2s ease-out; }
        .leader-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e2026; font-size: 13px; }
        .promo-input { width: 100%; padding: 10px; background: #0b0b0d; border: 1px solid #2a2b30; border-radius: 8px; color: #fff; text-align: center; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121316;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e2026;
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6c7080;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active { color: #ffffff; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>

        <div class="balance-badge">

            <span id="usdt-balance">0.000000</span> <span style="font-size:1
