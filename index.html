
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars Honey Bee</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17120b;color:#fff3c4;font-family:Arial,sans-serif;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;background:#2b2110;padding:16px;border-radius:16px}
h1{font-size:23px;color:#ffc928;text-align:center}
.stats{display:flex;justify-content:space-around;margin:16px 0;background:#30230f;padding:14px;border-radius:14px}
#hive{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#21190e;padding:12px;border-radius:16px}
.bee{min-height:75px;background:#4a3615;border:1px solid #88621b;border-radius:12px;color:white;font-size:30px;cursor:pointer}
.bee small{display:block;font-size:11px;color:#ffe28a;margin-top:5px}
button.action{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#ffc928;color:#332200;font-size:16px;font-weight:bold}
p{text-align:center;color:#e5d5a4;font-size:13px}
</style>
</head>
<body>
<header>
  <b>🐝 Stars Honey</b>
  <span>🍯 <b id="honey">0</b></span>
</header>
<h1>Arı ferması</h1>
<div class="stats">
  <div>🐝 Arılar<br><b id="count">1</b></div>
  <div>⚡ Saniyəlik bal<br><b id="rate">1</b></div>
  <div>⭐ Səviyyə<br><b id="level">1</b></div>
</div>
<p>Eyni səviyyəli iki arıya toxun və onları birləşdir!</p>
<div id="hive"></div>
<button class="action" onclick="buyBee()">🐝 Yeni arı al — <span id="price">10</span> bal</button>
<p id="message">Arılarına toxunaraq oyuna başla.</p>
<script>
let honey=0, bees=[1], selected=-1, price=10;
const saved=localStorage.getItem("stars_honey_game");
if(saved){
 try{
  const d=JSON.parse(saved);
  honey=d.honey||0;
  bees=Array.isArray(d.bees)&&d.bees.length?d.bees:[1];
  price=d.price||10;
 }catch(e){}
}
function save(){
 localStorage.setItem("stars_honey_game",JSON.stringify({honey,bees,price}));
}
function render(){
 document.getElementById("honey").textContent=Math.floor(honey);
 document.getElementById("count").textContent=bees.length;
 document.getElementById("rate").textContent=bees.reduce((a,b)=>a+b,0);
 document.getElementById("level").textContent=Math.max(...bees);
 document.getElementById("price").textContent=price;
 const hive=document.getElementById("hive");
 hive.innerHTML="";
 for(let i=0;i<16;i++){
  const b=document.createElement("button");
  b.className="bee";
  if(bees[i]){
   b.innerHTML="🐝<small>Səviyyə "+bees[i]+"</small>";
   b.onclick=()=>tapBee(i);
  }else{
   b.innerHTML="＋<small>Boş yer</small>";
   b.onclick=()=>document.getElementById("message").textContent="Boş yerə yeni arı ala bilərsən.";
  }
  hive.appendChild(b);
 }
 save();
}
function tapBee(i){
 if(selected<0){selected=i;document.getElementById("message").textContent="İndi eyni səviyyəli başqa arını seç.";return;}
 if(selected===i){selected=-1;document.getElementById("message").textContent="Seçim ləğv edildi.";return;}
 if(bees[selected]===bees[i]){
  bees[selected]++;
  bees.splice(i,1);
  selected=-1;
  document.getElementById("message").textContent="Əla! Arılar birləşdi! 🐝✨";
 }else{
  selected=i;
  document.getElementById("message").textContent="Eyni səviyyəli arını seç.";
 }
 render();
}
function buyBee(){
 if(bees.length>=16){document.getElementById("message").textContent="Fermada boş yer yoxdur. Arıları birləşdir.";return;}
 if(honey<price){document.getElementById("message").textContent="Yeni arı almaq üçün daha çox bal topla.";return;}
 honey-=price;
 bees.push(1);
 price=Math.ceil(price*1.5);
 render();
 document.getElementById("message").textContent="Yeni arı alındı! 🐝";
}
setInterval(()=>{honey+=bees.reduce((a,b)=>a+b,0)/10;render();},1000);
render();
</script>
</body>
</html>
